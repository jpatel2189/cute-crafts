<footer class="app-footer">
    <div class="container">
        
        <!-- Compact Single Row Layout -->
        <div class="row align-items-center">
            
            <!-- Brand & Products -->
            <div class="col-md-5 mb-3 mb-md-0">
                <img [src]="brandInfo.logo" 
                     [alt]="brandInfo.name" 
                     class="footer-logo" />
                
                <div class="footer-brand">
                    <h5 class="brand-name">{{ brandInfo.name }}</h5>
                    <p class="brand-tagline">{{ brandInfo.tagline }}</p>
                </div>

                <!-- Product Tags -->
                <div class="product-tags">
                    <span *ngFor="let product of products" class="product-tag">
                        {{ product }}
                    </span>
                </div>
            </div>

            <!-- Quick Links -->
            <div class="col-md-3 mb-3 mb-md-0">
                <ul class="footer-links">
                    <li *ngFor="let link of quickLinks">
                        <a [routerLink]="link.route" 
                           [attr.aria-label]="'Navigate to ' + link.label">
                            {{ link.label }}
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Social Links -->
            <div class="col-md-4 text-md-end">
                <div class="footer-socials">
                    <a *ngFor="let social of socialLinks"
                       [href]="social.url" 
                       target="_blank" 
                       rel="noopener noreferrer"
                       [class]="'social-icon ' + social.class"
                       [attr.aria-label]="social.ariaLabel">
                        <i [class]="social.icon"></i>
                    </a>
                </div>
            </div>

        </div>

        <!-- Bottom Copyright -->
        <div class="footer-bottom text-center">
            <p>
                © {{ currentYear }} {{ brandInfo.name }}. All rights reserved.
            </p>
            <div class="made-with-love">
                <span>Made with</span>
                <span class="heart">♥</span>
                <span>and premium wool</span>
            </div>
        </div>

    </div>
</footer>
